stages:
  - lint
  - test
  - build
  - deploy

default:
  image: node:22
  interruptible: true
  before_script:
    - npm ci
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

variables:
  GIT_DEPTH: "0"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

validate_content:
  stage: lint
  script:
    - npm run validate:content
    - npm run lint
    - npm run check

test_browser:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  script:
    - npm test

audit_dependencies:
  stage: test
  script:
    - npm run audit

build_site:
  stage: build
  script:
    - npm run build
    - npm run deploy:dry-run
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

deploy_preview:
  stage: deploy
  needs:
    - job: build_site
      artifacts: true
  script:
    - test -n "$CLOUDFLARE_API_TOKEN"
    - test -n "$CLOUDFLARE_ACCOUNT_ID"
    - npx wrangler deploy --config wrangler.preview.toml --name "docu-preview-$CI_COMMIT_SHORT_SHA"
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://docu-preview-$CI_COMMIT_SHORT_SHA.$CLOUDFLARE_WORKERS_SUBDOMAIN.workers.dev
    auto_stop_in: 7 days
    on_stop: stop_preview
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stop_preview:
  stage: deploy
  needs: []
  before_script: []
  script:
    - test -n "$CLOUDFLARE_API_TOKEN"
    - test -n "$CLOUDFLARE_ACCOUNT_ID"
    - npx --yes wrangler@4 delete --config wrangler.preview.toml --name "docu-preview-$CI_COMMIT_SHORT_SHA" --force
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

deploy_cloudflare:
  stage: deploy
  resource_group: production
  needs:
    - job: build_site
      artifacts: true
  script:
    - test -n "$CLOUDFLARE_API_TOKEN"
    - test -n "$CLOUDFLARE_ACCOUNT_ID"
    - npx wrangler deploy
    - node --input-type=module -e 'const response = await fetch("https://docu.adenyrr.me/"); if (response.status !== 200) process.exit(1)'
  environment:
    name: cloudflare-worker
    url: https://docu.adenyrr.me
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
