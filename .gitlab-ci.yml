stages:
  - update
  - lint
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

renovate:
  stage: update
  image: renovate/renovate:latest
  variables:
    RENOVATE_TOKEN: "${PERSONAL_TOKEN}"
    RENOVATE_ENDPOINT: "${CI_API_V4_URL}"
  script:
    - test -n "$RENOVATE_TOKEN" || { echo "PERSONAL_TOKEN is not available to this pipeline."; exit 1; }
    - renovate --platform gitlab --autodiscover --autodiscover-filter="$CI_PROJECT_PATH"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
  

lint_markdown:
  stage: lint
  image: node:24
  script:
    - npm i -g markdownlint-cli
    - markdownlint "docs/**/*.md" --config .markdownlint.json || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
  allow_failure: true

build_site:
  stage: build
  image: python:3.14
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - python scripts/generate_revision_dates.py
    - zensical build --clean
    - if [ -f "$CI_PROJECT_DIR/sitemap.xml" ]; then cp -v "$CI_PROJECT_DIR/sitemap.xml" public/; else echo "sitemap.xml not found in repo root"; fi
    - if [ -f "$CI_PROJECT_DIR/robots.txt" ]; then cp -v "$CI_PROJECT_DIR/robots.txt" public/; else echo "robots.txt not found in repo root"; fi
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy_cloudflare:
  stage: deploy
  image: node:24
  script:
    - npm install --global wrangler@4
    - test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not available to this pipeline."; exit 1; }
    - test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not available to this pipeline."; exit 1; }
    - wrangler deploy
  environment:
    name: cloudflare-worker
    url: https://docu.adenyrr.be
  needs:
    - job: build_site
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
